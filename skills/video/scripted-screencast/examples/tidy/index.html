<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Tidy</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root {
    --bg: #fbfaf8; --panel: #ffffff; --line: #ecebe7; --ink: #1d1d22; --muted: #8a8a93;
    --accent: #5b5bf0; --accent-soft: #ececfe; --green: #1fa971;
    font-family: -apple-system, "SF Pro Text", "Segoe UI", "Helvetica Neue", Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); }
  .app { display: grid; grid-template-columns: 232px 1fr; height: 100vh; }
  aside { border-right: 1px solid var(--line); padding: 22px 14px; background: #f6f5f2; }
  .brand { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 18px; padding: 0 10px 20px; }
  .logo { width: 26px; height: 26px; border-radius: 8px; background: linear-gradient(135deg, #7b7bff, #5b5bf0); display: grid; place-items: center; color: #fff; font-size: 15px; }
  .nav a { display: flex; justify-content: space-between; padding: 8px 10px; border-radius: 8px; color: #4a4a52; text-decoration: none; font-size: 14px; margin-bottom: 2px; }
  .nav a.on { background: #fff; color: var(--ink); font-weight: 600; box-shadow: 0 1px 2px rgba(0,0,0,.05); }
  .nav a:hover { background: #fff; }
  .nav small { color: var(--muted); }
  .sect { font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); padding: 18px 10px 8px; }
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 8px; }
  main { display: flex; flex-direction: column; min-height: 0; }
  header { display: flex; align-items: flex-end; justify-content: space-between; padding: 30px 40px 18px; }
  h1 { margin: 0; font-size: 28px; letter-spacing: -.02em; }
  .date { color: var(--muted); font-size: 14px; margin-top: 4px; }
  .btn { border: 0; background: var(--accent); color: #fff; font: inherit; font-weight: 600; font-size: 14px; padding: 10px 16px; border-radius: 10px; cursor: pointer; transition: transform .15s, background .15s; }
  .btn:hover { background: #4a4ae0; }
  .btn:active { transform: scale(.97); }
  .progress { padding: 0 40px 16px; display: flex; align-items: center; gap: 14px; font-size: 13px; color: var(--muted); }
  .bar { flex: 1; height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; }
  .bar i { display: block; height: 100%; background: var(--green); border-radius: 3px; transition: width .5s cubic-bezier(.2,.8,.2,1); }
  .composer { margin: 0 40px; max-height: 0; opacity: 0; overflow: hidden; transition: max-height .35s ease, opacity .25s ease, margin .35s ease; }
  .composer.open { max-height: 140px; opacity: 1; margin-bottom: 14px; }
  .composer .box { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px; display: flex; gap: 10px; align-items: center; box-shadow: 0 4px 18px rgba(30,30,60,.06); }
  .composer input { flex: 1; border: 0; outline: 0; font: inherit; font-size: 15px; padding: 6px 4px; background: transparent; }
  .pill { border: 1px solid var(--line); background: #fff; border-radius: 99px; font: inherit; font-size: 12px; padding: 5px 10px; cursor: pointer; color: #55555e; }
  .pill.on { background: var(--accent-soft); border-color: #cfcffb; color: var(--accent); font-weight: 600; }
  .list { flex: 1; overflow-y: auto; padding: 0 40px 40px; }
  .task { display: flex; align-items: center; gap: 14px; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; margin-bottom: 10px; }
  .task.new { animation: pop .6s cubic-bezier(.2,.9,.3,1.2); }
  @keyframes pop { from { transform: translateY(-8px) scale(.98); opacity: 0; background: var(--accent-soft); } to { transform: none; opacity: 1; background: var(--panel); } }
  .check { width: 20px; height: 20px; border-radius: 50%; border: 2px solid #c9c9d1; background: #fff; cursor: pointer; flex: none; display: grid; place-items: center; transition: background .2s, border-color .2s; padding: 0; }
  .check svg { opacity: 0; transform: scale(.4); transition: opacity .2s, transform .25s cubic-bezier(.2,.9,.3,1.4); }
  .done .check { background: var(--green); border-color: var(--green); }
  .done .check svg { opacity: 1; transform: none; }
  .title { flex: 1; font-size: 15px; transition: color .2s; }
  .done .title { color: var(--muted); text-decoration: line-through; }
  .tag { font-size: 12px; padding: 3px 9px; border-radius: 99px; background: #f3f2ef; color: #66666f; }
  .tag.High { background: #ffe9e6; color: #c4402c; }
  .tag.Med { background: #fff4d9; color: #a2700a; }
  .due { font-size: 12px; color: var(--muted); width: 64px; text-align: right; }
  .toast { position: fixed; left: 50%; bottom: 28px; transform: translate(-50%, 16px); opacity: 0; background: #1d1d22; color: #fff; font-size: 14px; padding: 11px 18px; border-radius: 10px; transition: opacity .25s, transform .3s cubic-bezier(.2,.9,.3,1.2); pointer-events: none; }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }
</style>
</head>
<body>
<div class="app">
  <aside>
    <div class="brand"><span class="logo">✓</span>Tidy</div>
    <nav class="nav">
      <a href="#">Inbox <small>4</small></a>
      <a href="#" class="on">Today <small id="navCount"></small></a>
      <a href="#">Upcoming <small>11</small></a>
      <a href="#">Someday</a>
    </nav>
    <div class="sect">Projects</div>
    <nav class="nav">
      <a href="#"><span><span class="dot" style="background:#5b5bf0"></span>Spring launch</span></a>
      <a href="#"><span><span class="dot" style="background:#1fa971"></span>Home</span></a>
      <a href="#"><span><span class="dot" style="background:#f0a020"></span>Studio</span></a>
    </nav>
  </aside>
  <main>
    <header>
      <div><h1>Today</h1><div class="date" id="date"></div></div>
      <button class="btn" id="newBtn">+ New task</button>
    </header>
    <div class="progress"><div class="bar"><i id="barFill"></i></div><span id="count"></span></div>
    <div class="composer" id="composer">
      <div class="box">
        <input id="title" placeholder="What needs doing?" autocomplete="off">
        <button class="pill" data-p="Low">Low</button>
        <button class="pill on" data-p="Med">Med</button>
        <button class="pill" data-p="High">High</button>
        <button class="btn" id="addBtn">Add</button>
      </div>
    </div>
    <div class="list" id="list"></div>
  </main>
</div>
<div class="toast" id="toast"></div>
<script>
  const DEFAULT = [
    { title: "Review homepage copy", tag: "High", due: "10:00", done: true },
    { title: "Reply to the print shop", tag: "Med", due: "11:30", done: false },
    { title: "Water the plants", tag: "Low", due: "Noon", done: false },
  ];
  let tasks;
  try { tasks = JSON.parse(localStorage.getItem("tidy.tasks")) || DEFAULT; } catch { tasks = DEFAULT; }
  let priority = "Med";
  const $ = (id) => document.getElementById(id);
  $("date").textContent = new Date().toLocaleDateString("en-US", { weekday: "long", month: "long", day: "numeric" });

  function render(newIndex = -1) {
    $("list").innerHTML = "";
    tasks.forEach((t, i) => {
      const row = document.createElement("div");
      row.className = "task" + (t.done ? " done" : "") + (i === newIndex ? " new" : "");
      row.innerHTML = `<button class="check" aria-label="Complete ${t.title}"><svg width="12" height="12" viewBox="0 0 12 12"><path d="M2.5 6.2 5 8.6 9.6 3.6" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
        <span class="title"></span><span class="tag ${t.tag}">${t.tag}</span><span class="due">${t.due}</span>`;
      row.querySelector(".title").textContent = t.title;
      row.querySelector(".check").onclick = () => { t.done = !t.done; row.classList.toggle("done", t.done); stats(); };
      $("list").appendChild(row);
    });
    stats();
  }
  function stats() {
    const d = tasks.filter((t) => t.done).length;
    $("count").textContent = `${d} of ${tasks.length} done`;
    $("navCount").textContent = tasks.length - d;
    $("barFill").style.width = (100 * d / tasks.length) + "%";
  }
  let toastTimer;
  function toast(msg) {
    $("toast").textContent = msg;
    $("toast").classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => $("toast").classList.remove("show"), 2200);
  }
  $("newBtn").onclick = () => { $("composer").classList.add("open"); setTimeout(() => $("title").focus(), 120); };
  document.querySelectorAll(".pill").forEach((p) => p.onclick = () => {
    priority = p.dataset.p;
    document.querySelectorAll(".pill").forEach((q) => q.classList.toggle("on", q === p));
    $("title").focus();
  });
  function add() {
    const title = $("title").value.trim();
    if (!title) return;
    tasks.unshift({ title, tag: priority, due: "Today", done: false });
    $("title").value = "";
    $("composer").classList.remove("open");
    render(0);
    toast("Added to Today");
  }
  $("addBtn").onclick = add;
  $("title").addEventListener("keydown", (e) => { if (e.key === "Enter") add(); });
  render();
</script>
</body>
</html>
