<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="280" viewBox="0 0 1200 280" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">
<rect width="1200" height="280" fill="#ffffff"/>
<text x="70" y="32" font-size="20" font-weight="600" fill="#111">uv: Create a new Python project with uv, add one third-party package, and run a script that imports it</text>
<text x="70" y="54" font-size="13" fill="#555">Modelled time for a first-time developer. 11 steps, 3 pages, 2 context switches, 1 error, success at 15.1 min.</text>
<text x="62" y="113" font-size="11" fill="#777" text-anchor="end">page</text>
<rect x="70.0" y="96" width="274.7" height="26" fill="#eef2f7"/>
<text x="75.0" y="113" font-size="11" fill="#333">uv</text>
<rect x="344.7" y="96" width="199.0" height="26" fill="#dfe6ef"/>
<text x="349.7" y="113" font-size="11" fill="#333">first-steps</text>
<rect x="543.6" y="96" width="616.4" height="26" fill="#eef2f7"/>
<text x="548.6" y="113" font-size="11" fill="#333">projects</text>
<line x1="70" y1="204" x2="1160" y2="204" stroke="#bbb"/>
<line x1="70.0" y1="204" x2="70.0" y2="209" stroke="#999"/><text x="70.0" y="222" font-size="11" fill="#777" text-anchor="middle">0m</text>
<line x1="430.4" y1="204" x2="430.4" y2="209" stroke="#999"/><text x="430.4" y="222" font-size="11" fill="#777" text-anchor="middle">5m</text>
<line x1="790.9" y1="204" x2="790.9" y2="209" stroke="#999"/><text x="790.9" y="222" font-size="11" fill="#777" text-anchor="middle">10m</text>
<line x1="1151.3" y1="204" x2="1151.3" y2="209" stroke="#999"/><text x="1151.3" y="222" font-size="11" fill="#777" text-anchor="middle">15m</text>
<rect x="386.5" y="130" width="131.9" height="74" fill="#c9372c" opacity="0.08"/>
<text x="389.5" y="142" font-size="11" fill="#c9372c">roughest stretch</text>
<line x1="70" y1="170" x2="1160" y2="170" stroke="#e3e3e3"/>
<circle cx="316.5" cy="170" r="5" fill="#3f7d58" stroke="#fff" stroke-width="1.5"><title>#1 Land on the docs home and find the install command</title></circle>
<text x="316.5" y="159" font-size="10" fill="#444" text-anchor="middle">1</text>
<circle cx="344.7" cy="170" r="5" fill="#3f7d58" stroke="#fff" stroke-width="1.5"><title>#2 Run the standalone installer</title></circle>
<text x="344.7" y="159" font-size="10" fill="#444" text-anchor="middle">2</text>
<circle cx="386.5" cy="170" r="5" fill="#3f7d58" stroke="#fff" stroke-width="1.5"><title>#3 Follow &#x27;first steps&#x27; link to check the install</title></circle>
<text x="386.5" y="159" font-size="10" fill="#444" text-anchor="middle">3</text>
<circle cx="518.4" cy="170" r="8" fill="#c9372c" stroke="#fff" stroke-width="1.5"><title>#4 Run uv in the same terminal, as first steps says</title></circle>
<text x="518.4" y="156" font-size="10" fill="#444" text-anchor="middle">4</text>
<circle cx="543.6" cy="170" r="5" fill="#3f7d58" stroke="#fff" stroke-width="1.5"><title>#5 Source the env file the installer printed, then run uv</title></circle>
<text x="543.6" y="159" font-size="10" fill="#444" text-anchor="middle">5</text>
<circle cx="875.2" cy="170" r="5" fill="#3f7d58" stroke="#fff" stroke-width="1.5"><title>#6 Open the &#x27;Working on projects&#x27; guide from first steps</title></circle>
<text x="875.2" y="159" font-size="10" fill="#444" text-anchor="middle">6</text>
<circle cx="899.8" cy="170" r="5" fill="#3f7d58" stroke="#fff" stroke-width="1.5"><title>#7 Create a project</title></circle>
<text x="899.8" y="159" font-size="10" fill="#444" text-anchor="middle">7</text>
<circle cx="979.1" cy="170" r="8" fill="#d08a17" stroke="#fff" stroke-width="1.5"><title>#8 Try the generated entry point</title></circle>
<text x="979.1" y="156" font-size="10" fill="#444" text-anchor="middle">8</text>
<circle cx="1023.0" cy="170" r="5" fill="#3f7d58" stroke="#fff" stroke-width="1.5"><title>#9 Add a dependency (Running commands section)</title></circle>
<text x="1023.0" y="159" font-size="10" fill="#444" text-anchor="middle">9</text>
<circle cx="1131.2" cy="170" r="8" fill="#d08a17" stroke="#fff" stroke-width="1.5"><title>#10 Save the docs script as example.py (copied with the copy button)</title></circle>
<text x="1131.2" y="156" font-size="10" fill="#444" text-anchor="middle">10</text>
<path d="M1160.0,140 L1160.0,170 M1160.0,140 l14,5 l-14,5" stroke="#1f6feb" stroke-width="2" fill="#1f6feb"/>
<circle cx="1160.0" cy="170" r="5" fill="#1f6feb" stroke="#fff" stroke-width="1.5"><title>#11 Run the script in the project</title></circle>
<text x="1160.0" y="189" font-size="10" fill="#444" text-anchor="middle">11</text>
<circle cx="690" cy="264" r="5" fill="#3f7d58"/><text x="700" y="268" font-size="11" fill="#555">worked</text>
<circle cx="770" cy="264" r="5" fill="#d08a17"/><text x="780" y="268" font-size="11" fill="#555">worked, with friction</text>
<circle cx="920" cy="264" r="5" fill="#c9372c"/><text x="930" y="268" font-size="11" fill="#555">error</text>
<circle cx="1000" cy="264" r="5" fill="#1b1b1b"/><text x="1010" y="268" font-size="11" fill="#555">wall</text>
<circle cx="1080" cy="264" r="5" fill="#1f6feb"/><text x="1090" y="268" font-size="11" fill="#555">success</text>
<text x="70" y="268" font-size="11" fill="#777">bigger dot = higher severity; shaded bands = docs page in use</text>
</svg>