# v2 of the deliberately flawed sample. Some changes fix v1 problems,
# some quietly break existing clients. breaking_diff.py should tell them apart.
openapi: 3.1.0
info:
  title: Bookshop Orders API (deliberately flawed sample)
  version: 1.5.0          # minor bump, although several changes below are breaking
  description: >
    Version two of the fictional sample API.
servers:
  - url: https://api.bookshop.example/v1
security:
  - bearerAuth: []
paths:
  /customers:
    get:
      operationId: listCustomers
      parameters:
        - name: limit
          in: query
          schema: {type: integer, default: 20, maximum: 100}
        - name: starting_after
          in: query
          schema: {type: string}
      responses:
        '200':
          description: A page of customers
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: {$ref: '#/components/schemas/Customer'}
                  has_more: {type: boolean}
        default:
          $ref: '#/components/responses/Problem'
  /customer/{customerId}:
    parameters:
      - name: customerId
        in: path
        required: true
        schema: {type: string}
    get:
      operationId: getCustomer
      responses:
        '200':
          description: A customer
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Customer'}
        '404':
          description: Not found
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
    put:
      operationId: updateCustomer
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/Customer'}
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Customer'}
        '400':
          description: Bad input
  /orders:
    get:
      operationId: listOrders
      parameters:
        - name: status
          in: query
          schema: {$ref: '#/components/schemas/OrderStatus'}
        - name: limit
          in: query
          schema: {type: integer, default: 20, maximum: 100}
        - name: starting_after
          in: query
          schema: {type: string}
      responses:
        '200':
          description: A page of orders
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: {$ref: '#/components/schemas/Order'}
                  has_more: {type: boolean}
        '401':
          description: Unauthorized
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
    post:
      operationId: createOrder
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          schema: {type: string, maxLength: 255}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/NewOrder'}
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Order'}
        '400':
          description: Invalid
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '429':
          description: Slow down
          headers:
            Retry-After:
              schema: {type: integer}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
  /orders/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: {type: string}
    get:
      operationId: getOrder
      responses:
        '200':
          description: An order
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Order'}
        '404':
          description: Not found
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
    patch:
      operationId: updateOrder
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                shippingAddress: {type: string, maxLength: 200}
                notes: {type: string}
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Order'}
    delete:
      operationId: deleteOrder
      deprecated: true
      responses:
        '204':
          description: Deleted
  /orders/{order_id}/items:
    parameters:
      - name: order_id
        in: path
        required: true
        schema: {type: string}
    get:
      operationId: listOrderItems
      parameters:
        - name: page
          in: query
          schema: {type: integer, default: 1}
        - name: per_page
          in: query
          schema: {type: integer, default: 20, maximum: 100}
      responses:
        '200':
          description: Items
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: {$ref: '#/components/schemas/OrderItem'}
                  has_more: {type: boolean}
        '404':
          description: Not found
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
  /orders/{order_id}/refund:
    parameters:
      - name: order_id
        in: path
        required: true
        schema: {type: string}
    post:
      operationId: refundOrder
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                amount: {type: integer}
                reason:
                  type: string
                  enum: [duplicate, fraudulent, requested_by_customer]
      responses:
        '200':
          description: Refunded
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Order'}
  /payments:
    post:
      operationId: createPayment
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/Payment'}
      responses:
        '201':
          description: Payment
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Payment'}
        '402':
          description: Card declined
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
  /shippingLabels/{label_id}:
    get:
      operationId: getShippingLabel
      parameters:
        - name: label_id
          in: path
          required: true
          schema: {type: string}
      responses:
        '200':
          description: Label PDF
          content:
            application/pdf:
              schema: {type: string, format: binary}
  /health:
    get:
      operationId: health
      responses:
        '200':
          description: OK
webhooks:
  order.shipped:
    post:
      parameters:
        - name: Webhook-Signature
          in: header
          required: true
          schema: {type: string}
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                id: {type: string}
                type: {type: string}
                created_at: {type: string, format: date-time}
                order: {$ref: '#/components/schemas/Order'}
      responses:
        '200':
          description: Acknowledged
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  responses:
    Problem:
      description: Error
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Error'}
  schemas:
    Customer:
      type: object
      required: [id, email]
      properties:
        id: {type: string}
        email: {type: string, format: email}
        full_name: {type: string}
        created_at: {type: string, format: date-time}
    OrderStatus:
      type: string
      enum: [pending, Shipped, CANCELLED, refunded]
    Order:
      type: object
      required: [id, customer_id, status, created_at]
      properties:
        id: {type: string}
        customer_id: {type: string}
        status: {$ref: '#/components/schemas/OrderStatus'}
        total_amount: {type: integer, description: 'Minor units, for example 1999 for 19.99'}
        currency: {type: string}
        shippingAddress: {type: [string, 'null']}
        created_at: {type: string, format: date-time}
        updatedDate: {type: string}
        shipped: {type: integer, description: Unix seconds}
    NewOrder:
      type: object
      required: [customer_id, items, currency]
      properties:
        customer_id: {type: string}
        items:
          type: array
          items: {$ref: '#/components/schemas/OrderItem'}
        notes: {type: string, maxLength: 1000}
        currency: {type: string, pattern: '^[A-Z]{3}$'}
    OrderItem:
      type: object
      properties:
        isbn: {type: string}
        quantity: {type: integer, minimum: 1}
        unitPrice: {type: number}
    Payment:
      type: object
      required: [order_id, amount]
      properties:
        id: {type: string, readOnly: true}
        order_id: {type: string}
        amount: {type: number}
        card_token: {type: string}
    Error:
      type: object
      required: [type, title, status, code, request_id]
      properties:
        type: {type: string, format: uri}
        title: {type: string}
        status: {type: integer}
        detail: {type: string}
        code: {type: string}
        request_id: {type: string}
